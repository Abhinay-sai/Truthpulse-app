name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage 3 - Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Mock Secrets
        run: |
          mkdir -p lib/core
          echo "class Secrets { static const String groqAnalysisKey = 'mock'; static const String groqChatKey = 'mock'; static const String owmKey = 'mock'; }" > lib/core/secrets.dart

      - name: Stage 4 - Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Stage 5 - Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Stage 6 - Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthPulse-Android-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
          if-no-files-found: warn
