name: Publish Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Download Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41485615744
          name: TruthPulse-Android-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage 3 - Inspect downloaded artifact
        run: |
          ls -la

      - name: Stage 4 - Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 app-release.apk --title "TruthPulse Production Release v1.0.0" --notes "Production Android APK with live Render backend integration"
