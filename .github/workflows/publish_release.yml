name: Publish Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1 - Checkout
        uses: actions/checkout@v4

      - name: Stage 2 - Download Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 41613727114
          name: TruthPulse-Android-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage 3 - Inspect downloaded artifact
        run: |
          find . -name "*.apk"
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ./TruthPulse.apk

      - name: Stage 4 - Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          gh release create v1.0.0 ./TruthPulse.apk --title "TruthPulse Production Release v1.0.0" --notes "Production Android APK with live Render backend integration"
